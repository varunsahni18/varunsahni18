# Jekyll configuration for varunsahni.in
title: Varun Sahni
description: M.S. Computer Science student at NYU Courant. Former Software Engineer at Qualcomm. LLM Systems, Multi-Agent GenAI, On-Device AI.
baseurl: ""
url: "https://www.varunsahni.in"

# Build settings
markdown: kramdown
permalink: /blog/:year/:month/:day/:title/
highlighter: rouge
future: true

# Exclude from build
exclude:
  - README.md
  - .git
  - .gitignore
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

# Default front matter
defaults:
  - scope:
      path: "_posts"
    values:
      layout: post
  - scope:
      path: "blog"
    values:
      layout: default
