<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" style="background:#0d1117;font-family:SF Mono,Menlo,monospace">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#238636;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2ea043;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1f6feb;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8957e5;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#bc8cff;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#da3633;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f85149;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="g5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d29922;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e3b341;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="g6" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3fb950;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#56d364;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#30363d"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" fill="#e6edf3" font-size="16" font-weight="bold">speech-to-speech Pipeline Architecture</text>

  <!-- Pipeline boxes -->
  <rect x="20" y="70" width="120" height="60" rx="8" fill="url(#g1)" filter="url(#shadow)"/>
  <text x="80" y="97" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">VAD</text>
  <text x="80" y="115" text-anchor="middle" fill="#d5f5e3" font-size="9">Voice Activity</text>

  <rect x="165" y="70" width="120" height="60" rx="8" fill="url(#g2)" filter="url(#shadow)"/>
  <text x="225" y="97" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">STT</text>
  <text x="225" y="115" text-anchor="middle" fill="#cae8ff" font-size="9">Speech→Text</text>

  <rect x="310" y="70" width="120" height="60" rx="8" fill="url(#g3)" filter="url(#shadow)"/>
  <text x="370" y="93" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">Transcription</text>
  <text x="370" y="108" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">Notifier</text>
  <text x="370" y="122" text-anchor="middle" fill="#d2c5f2" font-size="8">Live updates</text>

  <rect x="455" y="70" width="120" height="60" rx="8" fill="url(#g4)" filter="url(#shadow)"/>
  <text x="515" y="97" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">LLM</text>
  <text x="515" y="115" text-anchor="middle" fill="#ffdce0" font-size="9">Language Model</text>

  <rect x="600" y="70" width="120" height="60" rx="8" fill="url(#g5)" filter="url(#shadow)"/>
  <text x="660" y="93" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">LM Output</text>
  <text x="660" y="108" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">Processor</text>
  <text x="660" y="122" text-anchor="middle" fill="#fef3d1" font-size="8">Tool calls</text>

  <rect x="745" y="70" width="120" height="60" rx="8" fill="url(#g6)" filter="url(#shadow)"/>
  <text x="805" y="97" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">TTS</text>
  <text x="805" y="115" text-anchor="middle" fill="#d5f5e3" font-size="9">Text→Speech</text>

  <!-- Arrows -->
  <line x1="140" y1="100" x2="163" y2="100" stroke="#30363d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="285" y1="100" x2="308" y2="100" stroke="#30363d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="430" y1="100" x2="453" y2="100" stroke="#30363d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="575" y1="100" x2="598" y2="100" stroke="#30363d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="720" y1="100" x2="743" y2="100" stroke="#30363d" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Queue labels -->
  <text x="152" y="90" text-anchor="middle" fill="#8b949e" font-size="7">Queue</text>
  <text x="297" y="90" text-anchor="middle" fill="#8b949e" font-size="7">Queue</text>
  <text x="442" y="90" text-anchor="middle" fill="#8b949e" font-size="7">Queue</text>
  <text x="587" y="90" text-anchor="middle" fill="#8b949e" font-size="7">Queue</text>
  <text x="732" y="90" text-anchor="middle" fill="#8b949e" font-size="7">Queue</text>

  <!-- CancelScope section -->
  <rect x="20" y="170" width="845" height="100" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="40" y="195" fill="#e6edf3" font-size="13" font-weight="bold">CancelScope — Generation Counter</text>

  <rect x="40" y="210" width="180" height="45" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="130" y="230" text-anchor="middle" fill="#58a6ff" font-size="11">cancel()</text>
  <text x="130" y="247" text-anchor="middle" fill="#8b949e" font-size="9">gen = (gen+1) &amp; 0xFFFFFFFF</text>

  <rect x="250" y="210" width="180" height="45" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="340" y="230" text-anchor="middle" fill="#58a6ff" font-size="11">is_stale(gen)</text>
  <text x="340" y="247" text-anchor="middle" fill="#8b949e" font-size="9">gen != self._gen</text>

  <rect x="460" y="210" width="180" height="45" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="550" y="230" text-anchor="middle" fill="#58a6ff" font-size="11">discarding</text>
  <text x="550" y="247" text-anchor="middle" fill="#8b949e" font-size="9">Drop stale audio</text>

  <rect x="670" y="210" width="180" height="45" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="760" y="230" text-anchor="middle" fill="#58a6ff" font-size="11">response_done()</text>
  <text x="760" y="247" text-anchor="middle" fill="#8b949e" font-size="9">Clear discard guard</text>

  <!-- Transport section -->
  <rect x="20" y="295" width="845" height="100" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="40" y="320" fill="#e6edf3" font-size="13" font-weight="bold">SessionTransport (ABC) — Protocol-Agnostic Output</text>

  <rect x="40" y="335" width="390" height="45" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="235" y="355" text-anchor="middle" fill="#3fb950" font-size="11">WebSocketTransport</text>
  <text x="235" y="372" text-anchor="middle" fill="#8b949e" font-size="9">JSON frames + base64 audio deltas</text>

  <rect x="460" y="335" width="390" height="45" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="655" y="355" text-anchor="middle" fill="#3fb950" font-size="11">WebRTCSession</text>
  <text x="655" y="372" text-anchor="middle" fill="#8b949e" font-size="9">RTP media tracks + oai-events data channel</text>

  <!-- Backend section -->
  <rect x="20" y="420" width="845" height="65" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="40" y="445" fill="#e6edf3" font-size="13" font-weight="bold">Swappable Backends</text>

  <text x="40" y="470" fill="#8b949e" font-size="10">
    STT: Whisper · FasterWhisper · Paraformer · Parakeet-TDT · MLX Audio
  </text>
  <text x="40" y="483" fill="#8b949e" font-size="10">
    LLM: Responses API · Chat Completions · MLX-LM · Transformers
  </text>
  <text x="500" y="470" fill="#8b949e" font-size="10">
    TTS: ChatTTS · Facebook MMS · PocketTTS · Kokoro · Qwen3
  </text>
</svg>
