<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" style="background:#0d1117;font-family:'SF Mono',Menlo,monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="400" fill="url(#bg)"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" fill="#58a6ff" font-size="16" font-weight="700">Video Decomposition Pipeline</text>

  <!-- Step 1: Video URL -->
  <rect x="30" y="70" width="140" height="60" rx="8" fill="#1c2128" stroke="#30363d" stroke-width="1.5"/>
  <text x="100" y="95" text-anchor="middle" fill="#f0f6fc" font-size="12" font-weight="600">Video URL</text>
  <text x="100" y="115" text-anchor="middle" fill="#8b949e" font-size="10">YouTube, Loom, TikTok</text>

  <!-- Arrow 1 -->
  <line x1="170" y1="100" x2="220" y2="100" stroke="url(#arrow)" stroke-width="2"/>
  <polygon points="220,95 230,100 220,105" fill="#3fb950"/>

  <!-- Step 2: yt-dlp -->
  <rect x="235" y="70" width="140" height="60" rx="8" fill="#1c2128" stroke="#30363d" stroke-width="1.5"/>
  <text x="305" y="95" text-anchor="middle" fill="#f0f6fc" font-size="12" font-weight="600">yt-dlp</text>
  <text x="305" y="115" text-anchor="middle" fill="#8b949e" font-size="10">Download + captions</text>

  <!-- Arrow 2 -->
  <line x1="375" y1="100" x2="425" y2="100" stroke="url(#arrow)" stroke-width="2"/>
  <polygon points="425,95 435,100 425,105" fill="#3fb950"/>

  <!-- Step 3: ffmpeg -->
  <rect x="440" y="70" width="140" height="60" rx="8" fill="#1c2128" stroke="#30363d" stroke-width="1.5"/>
  <text x="510" y="95" text-anchor="middle" fill="#f0f6fc" font-size="12" font-weight="600">ffmpeg</text>
  <text x="510" y="115" text-anchor="middle" fill="#8b949e" font-size="10">Frame extraction</text>

  <!-- Arrow 3 -->
  <line x1="580" y1="100" x2="630" y2="100" stroke="url(#arrow)" stroke-width="2"/>
  <polygon points="630,95 640,100 630,105" fill="#3fb950"/>

  <!-- Step 4: Claude -->
  <rect x="645" y="70" width="140" height="60" rx="8" fill="#1c2128" stroke="#58a6ff" stroke-width="2" filter="url(#glow)"/>
  <text x="715" y="95" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="600">Claude</text>
  <text x="715" y="115" text-anchor="middle" fill="#8b949e" font-size="10">Reads frames + transcript</text>

  <!-- Arrow 4 -->
  <line x1="785" y1="100" x2="835" y2="100" stroke="url(#arrow)" stroke-width="2"/>
  <polygon points="835,95 845,100 835,105" fill="#3fb950"/>

  <!-- Step 5: Answer -->
  <rect x="850" y="70" width="40" height="60" rx="8" fill="#1c2128" stroke="#3fb950" stroke-width="2"/>
  <text x="870" y="100" text-anchor="middle" fill="#3fb950" font-size="14" font-weight="700">✓</text>

  <!-- Divider -->
  <line x1="30" y1="160" x2="870" y2="160" stroke="#21262d" stroke-width="1"/>

  <!-- Bottom section: Two parallel paths -->
  <text x="450" y="190" text-anchor="middle" fill="#8b949e" font-size="11">Two parallel data streams feed into Claude</text>

  <!-- Left path: Frames -->
  <rect x="80" y="215" width="340" height="150" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="250" y="240" text-anchor="middle" fill="#f0f6fc" font-size="13" font-weight="600">🖼️ Frame Stream</text>

  <rect x="100" y="258" width="300" height="28" rx="4" fill="#161b22"/>
  <text x="250" y="277" text-anchor="middle" fill="#8b949e" font-size="10">efficient → keyframes only (near-instant)</text>

  <rect x="100" y="292" width="300" height="28" rx="4" fill="#161b22"/>
  <text x="250" y="311" text-anchor="middle" fill="#8b949e" font-size="10">balanced → scene-change detection</text>

  <rect x="100" y="326" width="300" height="28" rx="4" fill="#161b22"/>
  <text x="250" y="345" text-anchor="middle" fill="#8b949e" font-size="10">token-burner → max coverage</text>

  <!-- Right path: Transcript -->
  <rect x="480" y="215" width="340" height="150" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="650" y="240" text-anchor="middle" fill="#f0f6fc" font-size="13" font-weight="600">📝 Transcript Stream</text>

  <rect x="500" y="258" width="300" height="28" rx="4" fill="#161b22"/>
  <text x="650" y="277" text-anchor="middle" fill="#8b949e" font-size="10">Primary: yt-dlp native captions (free)</text>

  <rect x="500" y="292" width="300" height="28" rx="4" fill="#161b22"/>
  <text x="650" y="311" text-anchor="middle" fill="#8b949e" font-size="10">Fallback: Whisper API (Groq / OpenAI)</text>

  <rect x="500" y="326" width="300" height="28" rx="4" fill="#161b22"/>
  <text x="650" y="345" text-anchor="middle" fill="#8b949e" font-size="10">Output: timestamped text with t=MM:SS</text>

  <!-- Bottom note -->
  <text x="450" y="390" text-anchor="middle" fill="#484f58" font-size="10">Claude reads JPEG frames as images + transcript as text → answers grounded in what it actually saw and heard</text>
</svg>
